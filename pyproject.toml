[tool.ruff]
target-version = "py312"
line-length = 120
include = ["app/**/*.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
follow_imports = "silent"
files = [
  "app/core/contracts.py",
  "app/core/planning.py",
  "app/core/deposit_calendar.py",
  "app/exchanges/contracts.py",
  "app/webpage/status.py",
  "app/trading/forecast.py",
]
